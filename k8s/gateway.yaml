apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: aceest-gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /_gateway_ready
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: routing
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: routing
          configMap:
            name: aceest-routing-__CONFIG_HASH__
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-gateway
spec:
  selector:
    app: aceest-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
