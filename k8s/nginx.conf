upstream stable { server aceest-stable:8000; }
upstream experiment { server aceest-experiment:8000; }
upstream blue_green { server aceest-blue-green:8000; }
upstream rolling { server aceest-rolling:8000; }

map $http_x_demo_request $canary_key {
    "" $request_id;
    default $http_x_demo_request;
}
split_clients "canary:$canary_key" $canary_upstream {
    10% experiment;
    * stable;
}

map $http_x_demo_user $ab_key {
    "" $remote_addr;
    default $http_x_demo_user;
}
split_clients "ab:$ab_key" $ab_upstream {
    50% experiment;
    * stable;
}

# Use the original URI, including its query string, in a mirror subrequest.
map $request_uri $shadow_uri {
    ~^/shadow(?<shadow_target>/.*)$ $shadow_target;
    default /healthz;
}

server {
    listen 8080;
    absolute_redirect off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;

    location = / { return 302 /rolling/; }
    location = /_gateway_ready { return 200 "ok\n"; }

    location = /blue-green { return 308 /blue-green/$is_args$args; }
    location = /canary { return 308 /canary/$is_args$args; }
    location = /shadow { return 308 /shadow/$is_args$args; }
    location = /ab { return 308 /ab/$is_args$args; }
    location = /rolling { return 308 /rolling/$is_args$args; }

    location /blue-green/ { proxy_pass http://blue_green/; }
    location /rolling/ { proxy_pass http://rolling/; }

    location ~ ^/canary(/.*)$ {
        proxy_pass http://$canary_upstream$1$is_args$args;
    }
    location ~ ^/ab(/.*)$ {
        proxy_pass http://$ab_upstream$1$is_args$args;
    }

    location /shadow/ {
        # Restrict the experiment to read-only traffic.
        limit_except GET { deny all; }
        mirror /_shadow_copy;
        mirror_request_body off;
        proxy_pass http://stable/;
    }
    location = /_shadow_copy {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_pass http://experiment$shadow_uri;
    }
}
