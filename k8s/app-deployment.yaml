apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-__ROLE__
spec:
  replicas: __REPLICAS__
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 100
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest
      role: __ROLE__
  template:
    metadata:
      labels:
        app: aceest
        role: __ROLE__
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: "__IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
